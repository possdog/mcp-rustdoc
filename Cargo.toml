[package]
name = "mcp-rustdoc"
version = "0.1.0"
edition = "2024"
description = "An MCP for giving agents access to crate documentation."
license = "AGPL-3.0-only"
repository = "https://tangled.org/poss.dog/mcp-rustdoc"
keywords = ["mcp", "docs"]
categories = ["development-tools"]

[dependencies]
cargo-lock = "^10"
dirs = "^6"
fuzzy-matcher = "^0.3"
reqwest = { version = "^0.12", features = ["json"] }
rmcp = { version = "^0.14", features = ["transport-io"] }
rustdoc-types = "^0.57"
schemars = "^0.8"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "^2"
tokio = { version = "^1", features = ["macros", "process", "rt-multi-thread"] }
toml = "^0.8"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
walkdir = "2.5.0"
zstd = "^0.13"
