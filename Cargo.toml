[package]
name = "cratedoc"
version = "0.1.0"
edition = "2024"
description = "A CLI for browsing Rust crate documentation from docs.rs and local workspaces."
license = "AGPL-3.0-only"
repository = "https://tangled.org/poss.dog/cratedoc"
keywords = ["cli", "docs", "rustdoc"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
cargo-lock = "^10"
clap = { version = "^4", features = ["derive"] }
dirs = "^6"
fuzzy-matcher = "^0.3"
reqwest = { version = "^0.12", features = ["json"] }
rustdoc-types = "^0.57"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "^2"
tokio = { version = "^1", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml = "^0.8"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
walkdir = "2.5.0"
zstd = "^0.13"
